        manual_reasoning: Supported effort value, if the model exposes one
        images: Verify image input
        verify: Run synthetic verification
        search: Document search
        search_unavailable: Unavailable through ChatGPT. Search requires a separate retrieval and indexing setup; selecting a chat model does not enable it.
        feature:
          chat:
            name: Chat and requested edits
            description: Answer questions and request authorised financial changes.
            data: Messages, conversation history and permitted financial tool results.
            guidance: Multi-step questions and tool use may benefit from a stronger reasoning model.
          categorisation:
            name: Transaction categorisation
            description: Assign categories to transactions.
            data: Transaction descriptions, amounts and available categories.
            guidance: Usually a simple classification task; a smaller model may be sufficient.
          merchant_detection:
            name: Merchant detection
            description: Identify merchants behind transaction descriptions.
            data: Transaction descriptions and existing merchants.
            guidance: Often a matching task; ambiguous descriptions may need a more capable model.
          merchant_enrichment:
            name: Merchant enrichment
            description: Suggest official merchant websites.
            data: Merchant names and existing details.
            guidance: A larger model does not guarantee correct websites. Uncertain results should remain unset.
          bill_suggestions:
            name: Bill suggestions
            description: Suggest recurring bill amounts and schedules.
            data: Dated charges, categories and existing bill configuration.
            guidance: Irregular charges and schedules may benefit from stronger reasoning.
          insight_narration:
            name: Insight narration
            description: Explain financial insights already calculated by Sure.
            data: Computed facts for each insight.
            guidance: Primarily a writing task; a smaller model may be sufficient.
          pdf_summary:
            name: PDF identification and summary
            description: Identify document type and summarise its contents.
            data: PDF text or images of scanned pages.
            guidance: Requires image capability for scans. Complex layouts may need a more capable model.
          statement_extraction:
            name: Statement extraction
            description: Extract transactions for review before import.
            data: Statement text or scanned pages, including dates and amounts.
            guidance: Accuracy matters. Complex tables and scans may need a stronger image-capable model.
